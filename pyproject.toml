[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prejudge"
version = "0.1.0"
description = "Hackathon pre-judge agent built on the OpenMinion 0.1 Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["openminion>=0.1.18,<0.2", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prejudge = "prejudge.cli:main"

[tool.setuptools.packages.find]
include = ["prejudge*"]

[tool.setuptools.package-data]
prejudge = ["rules_library/*.md"]
